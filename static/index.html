<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hecatech AI Agent — Preview</title>
  <style>
    :root {
      --bg: #0f1419;
      --surface: #1a2028;
      --surface-2: #242b36;
      --border: #2e3642;
      --text: #e6e8eb;
      --text-dim: #8b95a5;
      --accent: #4f8cff;
      --red: #e74c3c;
      --yellow: #f39c12;
      --green: #27ae60;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 24px;
      line-height: 1.5;
    }
    .container { max-width: 1200px; margin: 0 auto; }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border);
    }
    h1 { font-size: 22px; font-weight: 600; }
    .status {
      font-size: 13px;
      color: var(--text-dim);
      display: flex;
      gap: 12px;
      align-items: center;
    }
    .status .dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--green);
    }
    .status .dot.err { background: var(--red); }

    .tabs { display: flex; gap: 4px; margin-bottom: 16px; }
    .tab {
      padding: 10px 18px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text-dim);
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
      transition: all 0.15s;
    }
    .tab:hover { color: var(--text); }
    .tab.active {
      background: var(--accent);
      color: white;
      border-color: var(--accent);
    }

    .layout {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }
    .panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 18px;
    }
    .panel-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    textarea {
      width: 100%;
      height: 520px;
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 12px;
      font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      font-size: 12px;
      line-height: 1.5;
      resize: vertical;
    }
    textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; }

    .btn-row {
      display: flex;
      gap: 8px;
      margin-top: 12px;
      flex-wrap: wrap;
    }
    button {
      padding: 9px 16px;
      border: 1px solid var(--border);
      background: var(--surface-2);
      color: var(--text);
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      transition: all 0.15s;
    }
    button:hover { background: var(--border); }
    button.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: white;
    }
    button.primary:hover { background: #3b75e6; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }

    #output {
      height: 520px;
      overflow-y: auto;
      padding: 4px;
    }
    .empty {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: var(--text-dim);
      font-size: 14px;
      flex-direction: column;
      gap: 8px;
    }
    .spinner {
      width: 24px; height: 24px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Lark card rendering */
    .card {
      background: var(--surface-2);
      border-radius: 8px;
      padding: 14px 16px;
      margin-bottom: 10px;
      border-left: 4px solid var(--border);
    }
    .card.red { border-left-color: var(--red); }
    .card.yellow { border-left-color: var(--yellow); }
    .card.green { border-left-color: var(--green); }
    .card-header {
      font-size: 13px;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
      font-weight: 600;
    }
    .metric-row { margin: 4px 0; font-size: 14px; }
    .metric-label { color: var(--text-dim); }
    .metric-value { font-weight: 600; }
    .warning {
      background: var(--bg);
      border-radius: 6px;
      padding: 10px 12px;
      margin: 8px 0;
      border-left: 3px solid var(--border);
    }
    .warning.red { border-left-color: var(--red); }
    .warning.yellow { border-left-color: var(--yellow); }
    .warning-title { font-weight: 600; margin-bottom: 6px; }
    .warning-detail {
      font-size: 13px;
      color: var(--text-dim);
      margin-top: 4px;
      padding-left: 12px;
    }
    .owner {
      display: inline-block;
      background: var(--accent);
      color: white;
      padding: 1px 8px;
      border-radius: 10px;
      font-size: 11px;
      font-weight: 600;
      margin-left: 6px;
    }

    .cost-bar {
      background: var(--surface-2);
      border-radius: 6px;
      padding: 8px 12px;
      margin-top: 12px;
      font-size: 12px;
      color: var(--text-dim);
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
    }
    .cost-bar span { white-space: nowrap; }

    .error {
      background: rgba(231, 76, 60, 0.1);
      border: 1px solid var(--red);
      border-radius: 6px;
      padding: 12px;
      color: var(--red);
      font-size: 13px;
    }

    .tab-content { display: none; }
    .tab-content.active { display: block; }

    pre {
      background: var(--bg);
      padding: 10px;
      border-radius: 6px;
      overflow-x: auto;
      font-size: 11px;
      color: var(--text-dim);
      max-height: 200px;
      overflow-y: auto;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>🤖 Hecatech AI Agent — Local Preview</h1>
      <div class="status" id="status">
        <span class="dot" id="statusDot"></span>
        <span id="statusText">Checking...</span>
      </div>
    </header>

    <div class="tabs">
      <button class="tab active" data-tab="project">📊 Per-Project Agent (XKMVN)</button>
      <button class="tab" data-tab="ceo">📈 CEO Briefing Agent (11 dự án)</button>
    </div>

    <div class="layout">
      <!-- INPUT PANEL -->
      <div class="panel">
        <div class="panel-title">
          <span>Data input (JSON)</span>
          <button onclick="loadSample()">↻ Reload sample</button>
        </div>
        <textarea id="input" spellcheck="false"></textarea>
        <div class="btn-row">
          <button class="primary" onclick="runAnalysis()" id="runBtn">🚀 Phân tích với Claude</button>
          <button onclick="copyJSON('input')">📋 Copy</button>
        </div>
      </div>

      <!-- OUTPUT PANEL -->
      <div class="panel">
        <div class="panel-title">
          <span>Agent output</span>
          <button onclick="downloadJSON()" id="downloadBtn" style="display:none">💾 Download JSON</button>
        </div>
        <div id="output">
          <div class="empty">
            <span>Chưa có output</span>
            <span style="font-size: 12px">Load sample + click "Phân tích với Claude"</span>
          </div>
        </div>
        <div class="cost-bar" id="costBar" style="display:none"></div>
      </div>
    </div>
  </div>

  <script>
    let currentTab = 'project';
    let lastOutput = null;

    // Check API key status
    fetch('/api/health').then(r => r.json()).then(h => {
      const dot = document.getElementById('statusDot');
      const txt = document.getElementById('statusText');
      if (h.api_key_set) {
        dot.className = 'dot';
        txt.textContent = `✓ Connected to ${h.model}`;
      } else {
        dot.className = 'dot err';
        txt.textContent = '✗ ANTHROPIC_API_KEY chưa set';
      }
    });

    // Tab switching
    document.querySelectorAll('.tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        currentTab = tab.dataset.tab;
        loadSample();
      });
    });

    async function loadSample() {
      const input = document.getElementById('input');
      input.value = 'Đang load...';
      try {
        const r = await fetch(`/api/sample/${currentTab}`);
        const data = await r.json();
        input.value = JSON.stringify(data, null, 2);
      } catch (e) {
        input.value = `// Lỗi load sample: ${e.message}`;
      }
    }

    async function runAnalysis() {
      const btn = document.getElementById('runBtn');
      const output = document.getElementById('output');
      const costBar = document.getElementById('costBar');

      let data;
      try {
        data = JSON.parse(document.getElementById('input').value);
      } catch (e) {
        output.innerHTML = `<div class="error">JSON không hợp lệ: ${e.message}</div>`;
        return;
      }

      btn.disabled = true;
      btn.textContent = '⏳ Đang gọi Claude API...';
      output.innerHTML = '<div class="empty"><div class="spinner"></div><span>Claude đang phân tích...</span></div>';
      costBar.style.display = 'none';

      try {
        const r = await fetch('/api/analyze', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ agent_type: currentTab, data }),
        });
        if (!r.ok) {
          const err = await r.json();
          throw new Error(err.detail || `HTTP ${r.status}`);
        }
        const result = await r.json();
        lastOutput = result.parsed;
        render(result);
      } catch (e) {
        output.innerHTML = `<div class="error"><b>Lỗi:</b> ${e.message}</div>`;
      } finally {
        btn.disabled = false;
        btn.textContent = '🚀 Phân tích với Claude';
      }
    }

    function render(result) {
      const p = result.parsed;
      const html = currentTab === 'project' ? renderProject(p) : renderCEO(p);
      document.getElementById('output').innerHTML = html;

      const u = result.usage;
      const costVND = (u.cost_usd * 24000).toFixed(0);
      document.getElementById('costBar').style.display = 'flex';
      document.getElementById('costBar').innerHTML = `
        <span>🔤 Tokens: ${u.input_tokens} in + ${u.output_tokens} out</span>
        <span>💰 Call này: $${u.cost_usd.toFixed(4)} (~${costVND} VND)</span>
        <span>📅 30 ngày: ~$${(u.cost_usd * 30).toFixed(2)}</span>
      `;
      document.getElementById('downloadBtn').style.display = 'inline-block';
    }

    function fmtVND(v) {
      if (v == null) return '—';
      v = Number(v);
      if (v >= 1e9) return (v / 1e9).toFixed(2) + 'B';
      if (v >= 1e6) return (v / 1e6).toFixed(0) + 'M';
      if (v >= 1e3) return (v / 1e3).toFixed(0) + 'K';
      return v.toFixed(0);
    }

    function renderProject(p) {
      const emoji = { green: '✅', yellow: '🟡', red: '🔴' };
      const s = p.summary || {};
      let html = '';

      // Header card
      const g = s.gmv_yesterday || {};
      html += `<div class="card ${g.status || ''}">`;
      html += `<div class="panel-title">${p.project} — ${p.date}</div>`;
      html += `<div class="metric-row"><span class="metric-label">GMV hôm qua:</span> <span class="metric-value">${fmtVND(g.value)} ${emoji[g.status] || ''}</span>`;
      if (g.vs_benchmark_daily) html += ` <span class="metric-label">(${g.vs_benchmark_daily})</span>`;
      html += `</div>`;
      if (s.gmv_mtd) {
        html += `<div class="metric-row"><span class="metric-label">MTD:</span> ${fmtVND(s.gmv_mtd.value)} / ${fmtVND(s.gmv_mtd.target)} (${s.gmv_mtd.pct}% — ${s.gmv_mtd.pacing_status})</div>`;
      }
      if (s.net_profit_margin_mtd) {
        const npm = s.net_profit_margin_mtd;
        html += `<div class="metric-row"><span class="metric-label">Net margin MTD:</span> ${(npm.value*100).toFixed(1)}% ${emoji[npm.status] || ''}</div>`;
      }
      html += `</div>`;

      // Warnings
      const warnings = p.warnings || [];
      if (warnings.length > 0) {
        html += `<div class="card"><div class="panel-title">⚠️ Warning (${warnings.length})</div>`;
        warnings.forEach(w => {
          const streak = w.consecutive_days > 1 ? ` — ngày thứ ${w.consecutive_days}` : '';
          html += `<div class="warning ${w.status}">`;
          html += `<div class="warning-title">${w.priority}. ${emoji[w.status]} ${w.metric}: ${w.value}${streak}</div>`;
          html += `<div class="warning-detail"><span class="metric-label">Ngưỡng:</span> ${w.threshold || '—'}</div>`;
          if (w.root_cause) html += `<div class="warning-detail"><span class="metric-label">Nguyên nhân:</span> ${w.root_cause}</div>`;
          if (w.action) html += `<div class="warning-detail"><span class="metric-label">Hành động:</span> ${w.action}</div>`;
          if (w.owner) html += `<div class="warning-detail"><span class="metric-label">Owner:</span> <span class="owner">${w.owner}</span></div>`;
          if (w.missing_data_note) html += `<div class="warning-detail">ℹ️ ${w.missing_data_note}</div>`;
          html += `</div>`;
        });
        html += `</div>`;
      }

      // Bright spots
      const spots = p.bright_spots || [];
      if (spots.length > 0) {
        html += `<div class="card green"><div class="panel-title">✅ Điểm sáng</div>`;
        spots.forEach(b => {
          html += `<div class="metric-row">• <b>${b.metric}:</b> ${b.value} <span class="metric-label">(${b.note || ''})</span></div>`;
        });
        html += `</div>`;
      }

      // Top actions
      const actions = p.top_actions_today || [];
      if (actions.length > 0) {
        html += `<div class="card"><div class="panel-title">📋 Top việc hôm nay</div>`;
        actions.forEach(a => {
          html += `<div class="metric-row">${a.priority}. ${a.action} <span class="owner">${a.owner}</span></div>`;
        });
        html += `</div>`;
      }

      // Data quality
      const flags = p.data_quality_flags || [];
      if (flags.length > 0) {
        html += `<div class="card"><div class="panel-title">⚙️ Data notes</div>`;
        flags.forEach(f => html += `<div class="metric-row" style="color:var(--text-dim);font-size:13px">• ${f}</div>`);
        html += `</div>`;
      }

      return html;
    }

    function renderCEO(b) {
      const statusEmoji = { on_track: '🟢', at_risk: '🟡', alert: '🔴' };
      const r = b.rollup || {};
      const h = b.headline || {};
      let html = '';

      // Headline
      const headerClass = h.status === 'alert' ? 'red' : (h.status === 'at_risk' ? 'yellow' : 'green');
      html += `<div class="card ${headerClass}">`;
      html += `<div class="panel-title">📈 CEO Briefing — ${b.date}</div>`;
      html += `<div class="metric-row" style="font-size:15px;margin:8px 0"><b>${statusEmoji[h.status] || ''} ${h.one_liner || ''}</b></div>`;
      html += `</div>`;

      // Rollup
      html += `<div class="card"><div class="panel-title">📊 Tổng quan</div>`;
      html += `<div class="metric-row"><span class="metric-label">GMV hôm qua:</span> ${fmtVND(r.gmv_yesterday)} / ${fmtVND(r.gmv_daily_target)} (${r.pacing_pct || 0}%)</div>`;
      html += `<div class="metric-row"><span class="metric-label">MTD:</span> ${fmtVND(r.gmv_mtd)} / ${fmtVND(r.gmv_mtd_target)} (${r.mtd_pacing_pct || 0}% vs expected ${r.expected_mtd_pct || 0}%)</div>`;
      html += `<div class="metric-row"><span class="metric-label">Ads spend:</span> ${fmtVND(r.total_ads_spend_yesterday)} • <span class="metric-label">Blended take rate:</span> ${((r.blended_take_rate||0)*100).toFixed(1)}%</div>`;
      html += `<div class="metric-row"><span class="metric-label">Net margin MTD:</span> ${((r.blended_net_margin_mtd||0)*100).toFixed(1)}% • <span class="metric-label">LN hôm qua:</span> ${fmtVND(r.net_profit_yesterday)}</div>`;
      html += `</div>`;

      // Top 3
      const top = b.top_3_performers || [];
      if (top.length > 0) {
        html += `<div class="card green"><div class="panel-title">🏆 Top 3 dẫn đầu</div>`;
        top.forEach((p, i) => {
          html += `<div class="warning green"><div class="warning-title">${i+1}. ${p.project}: ${p.reason}</div>`;
          html += `<div class="warning-detail">→ Bài học: ${p.learn_from}</div></div>`;
        });
        html += `</div>`;
      }

      // Bottom 3
      const bottom = b.bottom_3_need_rescue || [];
      if (bottom.length > 0) {
        html += `<div class="card red"><div class="panel-title">🆘 3 dự án cần cứu</div>`;
        bottom.forEach((p, i) => {
          html += `<div class="warning red"><div class="warning-title">${i+1}. ${p.project}: ${p.reason}</div>`;
          html += `<div class="warning-detail">→ ${p.who_handles}</div></div>`;
        });
        html += `</div>`;
      }

      // CEO Decisions
      const decisions = b.ceo_must_decide_today || [];
      if (decisions.length > 0) {
        html += `<div class="card yellow"><div class="panel-title">⚡ CEO quyết định hôm nay</div>`;
        decisions.forEach(d => {
          html += `<div class="warning yellow">`;
          html += `<div class="warning-title">${d.priority}. ${d.decision}</div>`;
          html += `<div class="warning-detail"><span class="metric-label">Context:</span> ${d.context}</div>`;
          html += `<div class="warning-detail"><span class="metric-label">Stakeholder:</span> <span class="owner">${d.stakeholder}</span></div>`;
          html += `<div class="warning-detail"><span class="metric-label">Deadline:</span> ${d.deadline}</div>`;
          html += `</div>`;
        });
        html += `</div>`;
      }

      // Patterns
      const patterns = b.cross_project_patterns || [];
      if (patterns.length > 0) {
        html += `<div class="card"><div class="panel-title">🔍 Pattern đáng chú ý</div>`;
        patterns.forEach(p => {
          html += `<div class="warning red"><div class="warning-title">${p.pattern}</div>`;
          html += `<div class="warning-detail"><span class="metric-label">Giả thuyết:</span> ${p.hypothesis}</div>`;
          html += `<div class="warning-detail"><span class="metric-label">Khuyến nghị:</span> ${p.recommendation}</div></div>`;
        });
        html += `</div>`;
      }

      // Quick wins
      const wins = b.quick_wins_available || [];
      if (wins.length > 0) {
        html += `<div class="card green"><div class="panel-title">💡 Quick wins</div>`;
        wins.forEach(w => html += `<div class="metric-row">• ${w}</div>`);
        html += `</div>`;
      }

      // Data quality
      const flags = b.data_quality_flags || [];
      if (flags.length > 0) {
        html += `<div class="card"><div class="panel-title">⚙️ Data notes</div>`;
        flags.forEach(f => html += `<div class="metric-row" style="color:var(--text-dim);font-size:13px">• ${f}</div>`);
        html += `</div>`;
      }

      return html;
    }

    function copyJSON(id) {
      const el = document.getElementById(id);
      const text = id === 'input' ? el.value : JSON.stringify(lastOutput, null, 2);
      navigator.clipboard.writeText(text);
    }

    function downloadJSON() {
      if (!lastOutput) return;
      const blob = new Blob([JSON.stringify(lastOutput, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `${currentTab}-output-${lastOutput.date || 'result'}.json`;
      a.click();
      URL.revokeObjectURL(url);
    }

    // Initial load
    loadSample();
  </script>
</body>
</html>
