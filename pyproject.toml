[project]
name = "kpi-ai-agent"
version = "0.1.0"
description = "Knowledge-grounded KPI AI Agent with Lark routing"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.0.0",
  "openpyxl>=3.1.0",
  "pyyaml>=6.0.0",
  "requests>=2.31.0",
  "apscheduler>=3.10.4",
  "python-dateutil>=2.9.0",
]

[project.optional-dependencies]
llm = [
  "openai>=1.30.0",
]

test = [
  "pytest>=8.0.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
